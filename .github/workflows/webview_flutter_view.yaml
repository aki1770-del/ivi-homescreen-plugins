name: "webview_flutter_view"

on:
  pull_request:
    paths:
      # in plugins/[config stuff]
      - "plugins/.clang-*"
      - "plugins/CMakeLists.txt"
      - "plugins/*.cmake"
      - "plugins/*.h"
      - "plugins/*.cpp"
      - "plugins/*.cc"
      - "plugins/*.c"
      - "plugins/*.cc.in"
      # plugin path
      - "plugins/common/**"
      - "plugins/webview_flutter_view/**"
      # patches
      - "patches/**/*.patch"
      # workflow definition itself
      - ".github/workflows/webview_flutter_view.yaml"
      - ".github/workflows/_plugin_cpp-ci.yaml"
      - ".github/actions/homescreen-build/**"
  push:
    branches:
      - main

jobs:
  webview_flutter_view:
    uses: ./.github/workflows/_plugin_cpp-ci.yaml
    with:
      name: "webview_flutter_view"
      