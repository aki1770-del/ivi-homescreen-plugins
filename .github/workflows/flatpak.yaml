name: "flatpak"

on:
  pull_request:
    paths:
      # in plugins/[config stuff]
      - "plugins/.clang-*"
      - "plugins/CMakeLists.txt"
      - "plugins/*.cmake"
      - "plugins/*.h"
      - "plugins/*.cpp"
      - "plugins/*.cc"
      - "plugins/*.c"
      - "plugins/*.cc.in"
      # plugin path
      - "plugins/common/**"
      - "plugins/flatpak/**"
      # patches
      - "patches/**/*.patch"
      # workflow definition itself
      - ".github/workflows/flatpak.yaml"
      - ".github/workflows/_plugin_cpp-ci.yaml"
      - ".github/actions/homescreen-build/**"
  push:
    branches:
      - main

jobs:
  flatpak:
    uses: ./.github/workflows/_plugin_cpp-ci.yaml
    with:
      name: "flatpak"
      