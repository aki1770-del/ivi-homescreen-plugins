name: "desktop_window_linux"

on:
  pull_request:
    paths:
      # in plugins/[config stuff]
      - "plugins/.clang-*"
      - "plugins/CMakeLists.txt"
      - "plugins/*.cmake"
      - "plugins/*.h"
      - "plugins/*.cpp"
      - "plugins/*.cc"
      - "plugins/*.c"
      - "plugins/*.cc.in"
      # plugin path
      - "plugins/common/**"
      - "plugins/desktop_window_linux/**"
      # patches
      - "patches/**/*.patch"
      # workflow definition itself
      - ".github/workflows/desktop_window_linux.yaml"
      - ".github/workflows/_plugin_cpp-ci.yaml"
      - ".github/actions/homescreen-build/**"
  push:
    branches:
      - main

jobs:
  desktop_window_linux:
    uses: ./.github/workflows/_plugin_cpp-ci.yaml
    with:
      name: "desktop_window_linux"
      