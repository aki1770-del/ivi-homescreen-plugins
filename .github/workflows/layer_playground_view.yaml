name: "layer_playground_view"

on:
  pull_request:
    paths:
      # in plugins/[config stuff]
      - "plugins/.clang-*"
      - "plugins/CMakeLists.txt"
      - "plugins/*.cmake"
      - "plugins/*.h"
      - "plugins/*.cpp"
      - "plugins/*.cc"
      - "plugins/*.c"
      - "plugins/*.cc.in"
      # plugin path
      - "plugins/common/**"
      - "plugins/layer_playground_view/**"
      # patches
      - "patches/**/*.patch"
      # workflow definition itself
      - ".github/workflows/layer_playground_view.yaml"
      - ".github/workflows/_plugin_cpp-ci.yaml"
      - ".github/actions/homescreen-build/**"
  push:
    branches:
      - main

jobs:
  layer_playground_view:
    uses: ./.github/workflows/_plugin_cpp-ci.yaml
    with:
      name: "layer_playground_view"
      # The ihs_pv HDR ABI (IhsHdrMetadata, IhsFrame.hdr) used by this plugin's
      # LP_PV_HDR producer lives on ivi-homescreen v3.0, not v2.0. Build against
      # v3.0 so the HDR path compiles.
      homescreen-ref: "v3.0"
      